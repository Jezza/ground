[workspace]
resolver = "2"
members = [
    "crates/commons",
    "crates/cli",
    "crates/codegen-utils",
    "crates/env/derive",
    "crates/env",
    "crates/openapi",
    "crates/openapi/build",
    "crates/openapi/jsonnet",
    "crates/openapi/utils",
]

[workspace.lints.rust]
deprecated = "allow"

[workspace.lints.clippy]
derive_partial_eq_without_eq = "allow"
uninlined_format_args = "allow"
cast_possible_truncation = "warn"
unwrap_used = "deny"

[workspace.dependencies]
syn = "2.0.66"
quote = "1.0.36"
proc-macro2 = "1.0.85"

clap = { version = "4.5.4", features = ["env", "derive"] }
secrecy = { version = "0.8.0" }

humantime = "2.1.0"

opentelemetry = { version = "0.21.0" }
opentelemetry_sdk = { version = "0.21.2", features = ["rt-tokio"] }
opentelemetry-http = { version = "0.10.0" }
opentelemetry-otlp = { version = "0.14.0" }

tracing = { version = "0.1.40", features = ["log"] }
tracing-log = "0.2.0"
tracing-opentelemetry = { version = "0.22.0" }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["env-filter", "json", "registry", "fmt"] }

futures-util = "0.3.30"

regex = "1.10.4"

uuid = { version = "1.8.0", features = ["v4"] }

sqlx = "0.8.2"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.128"
cargo_toml = "0.20.2"
topo_sort = "0.4.0"

http = "1.1.0"

indexmap = "2.5.0"
openapiv3 = "2.0.0"
typify-impl = "0.2.0" # ? c6bf2806568013ca20a11a0fb30166ea809f612b
progenitor-impl = "0.8.0"

jrsonnet-evaluator = "0.5.0-pre95"
jrsonnet-gcmodule = "0.3.7"
jrsonnet-stdlib = "0.5.0-pre95"
jrsonnet-parser = "0.5.0-pre95"

rust-embed = "8.5.0"

prettyplease = "0.2.22"

heck = "0.5.0"
darling = "0.20.9"

anyhow = "1.0.86"
thiserror = "1.0.61"

ground-env = { path = "./crates/env", version = "0.2.0" }
ground-env-derive = { path = "./crates/env/derive", version = "0.2.0" }
ground-commons = { path = "./crates/commons", version = "0.1.0" }
ground-openapi = { path = "./crates/openapi", version = "0.1.0" }
ground-openapi-utils = { path = "./crates/openapi/utils", version = "0.1.0" }
ground-codegen-utils = { path = "./crates/codegen-utils", version = "0.1.0" }
